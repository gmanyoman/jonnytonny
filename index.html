<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#fdf4e3">
<title>주니토니 뮤지컬 동화</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1: #fff1d6;
    --bg-2: #ffd9e8;
    --bg-3: #e6dcff;
    --ink: #3a2540;
    --ink-soft: #6b5470;
    --card: #fffaf2;
    --gold: #e8a13a;
    --pink: #f06292;
    --lilac: #9c7ed1;
    --shadow: 0 8px 20px rgba(90, 50, 100, 0.12);
    --shadow-hover: 0 14px 32px rgba(90, 50, 100, 0.22);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body { height: 100%; }

  body {
    font-family: 'Gowun Dodum', sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 15% 10%, var(--bg-2) 0%, transparent 45%),
      radial-gradient(circle at 85% 90%, var(--bg-3) 0%, transparent 50%),
      var(--bg-1);
    background-attachment: fixed;
    min-height: 100vh;
    overflow-x: hidden;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* Floating sparkles */
  body::before, body::after {
    content: '';
    position: fixed;
    pointer-events: none;
    z-index: 0;
    background-repeat: no-repeat;
    opacity: 0.6;
  }
  body::before {
    top: 10%; left: 5%;
    width: 60px; height: 60px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23e8a13a'><path d='M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8z'/></svg>");
    background-size: contain;
    animation: float 6s ease-in-out infinite;
  }
  body::after {
    bottom: 8%; right: 6%;
    width: 50px; height: 50px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23f06292'><path d='M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8z'/></svg>");
    background-size: contain;
    animation: float 7s ease-in-out infinite reverse;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-20px) rotate(15deg); }
  }

  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 36px 20px 60px;
    position: relative;
    z-index: 1;
  }

  header {
    text-align: center;
    margin-bottom: 36px;
    position: relative;
  }

  .crown {
    font-size: 36px;
    display: inline-block;
    margin-bottom: 4px;
    animation: wiggle 3s ease-in-out infinite;
  }
  @keyframes wiggle {
    0%, 100% { transform: rotate(-5deg); }
    50% { transform: rotate(5deg); }
  }

  h1 {
    font-family: 'Black Han Sans', sans-serif;
    font-size: clamp(34px, 7vw, 54px);
    line-height: 1.1;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, var(--pink) 0%, var(--lilac) 50%, var(--gold) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    padding-bottom: 6px;
  }

  .subtitle {
    font-family: 'Jua', sans-serif;
    font-size: clamp(14px, 3.5vw, 17px);
    color: var(--ink-soft);
    margin-top: 6px;
    letter-spacing: 0.5px;
  }

  .subtitle::before, .subtitle::after {
    content: '✦';
    color: var(--gold);
    margin: 0 10px;
    opacity: 0.7;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
  }

  @media (min-width: 720px) {
    .grid { grid-template-columns: repeat(3, 1fr); gap: 22px; }
  }

  .card {
    display: block;
    text-decoration: none;
    color: inherit;
    background: var(--card);
    border-radius: 22px;
    overflow: hidden;
    box-shadow: var(--shadow);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    position: relative;
    border: 2px solid rgba(232, 161, 58, 0.15);
    animation: rise 0.6s ease backwards;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card:nth-child(1) { animation-delay: 0.05s; }
  .card:nth-child(2) { animation-delay: 0.10s; }
  .card:nth-child(3) { animation-delay: 0.15s; }
  .card:nth-child(4) { animation-delay: 0.20s; }
  .card:nth-child(5) { animation-delay: 0.25s; }
  .card:nth-child(6) { animation-delay: 0.30s; }
  .card:nth-child(7) { animation-delay: 0.35s; }
  .card:nth-child(8) { animation-delay: 0.40s; }
  .card:nth-child(9) { animation-delay: 0.45s; }

  .card:hover, .card:active {
    transform: translateY(-4px);
    box-shadow: var(--shadow-hover);
  }

  .thumb {
    position: relative;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    background: linear-gradient(135deg, var(--bg-2), var(--bg-3));
  }

  .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.4s ease;
  }

  .card:hover .thumb img { transform: scale(1.06); }

  .play {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .play svg {
    width: 54px; height: 54px;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.35));
    opacity: 0.95;
    transition: transform 0.25s ease;
  }
  .card:hover .play svg { transform: scale(1.15); }

  .info {
    padding: 14px 14px 16px;
    text-align: center;
  }

  .title {
    font-family: 'Jua', sans-serif;
    font-size: clamp(16px, 4vw, 19px);
    color: var(--ink);
    letter-spacing: -0.2px;
  }

  .badge {
    display: inline-block;
    margin-top: 4px;
    font-size: 11px;
    color: var(--ink-soft);
    background: rgba(232, 161, 58, 0.13);
    padding: 2px 9px;
    border-radius: 999px;
    font-family: 'Gowun Dodum', sans-serif;
  }

  footer {
    text-align: center;
    margin-top: 40px;
    font-size: 13px;
    color: var(--ink-soft);
    font-family: 'Gowun Dodum', sans-serif;
    opacity: 0.7;
  }
  footer .heart { color: var(--pink); }

  @media (min-width: 720px) {
    .play svg { width: 64px; height: 64px; }
  }
</style>
</head>
<body>
  <div class="container">
    <header>
      <div class="crown">👑</div>
      <h1>주니토니 뮤지컬 동화</h1>
      <p class="subtitle">노래로 만나는 우리들의 이야기</p>
    </header>

    <main class="grid" id="grid"></main>

    <footer>
      Made with <span class="heart">♥</span> for our little stars
    </footer>
  </div>

<script>
  const tales = [
    { title: '인어공주',        id: 'h3xiBmUmkcQ' },
    { title: '백설공주',        id: 'PPmN-kZioNA' },
    { title: '잠자는 숲 속의 공주', id: 'wK9g_KSzQmk' },
    { title: '라푼젤',          id: '047kwHXx2bc' },
    { title: '엄지공주',        id: 'M08wE7PebqE' },
    { title: '신데렐라',        id: 'Dmk8d4D4fes' },
    { title: '아기돼지 삼형제',  id: '1Ns6TTTrIXk' },
    { title: '개구리 왕자',     id: 'r2KgFrCsN7E' },
    { title: '미녀와 야수',     id: 'GB-hp7skvHU' },
  ];

  const playIcon = `
    <div class="play">
      <svg viewBox="0 0 68 48" xmlns="http://www.w3.org/2000/svg">
        <path d="M66.52 7.74c-.78-2.93-2.49-5.41-5.42-6.19C55.79.13 34 0 34 0S12.21.13 6.9 1.55C3.97 2.33 2.27 4.81 1.48 7.74 .06 13.05 0 24 0 24s.06 10.95 1.48 16.26c.78 2.93 2.49 5.41 5.42 6.19C12.21 47.87 34 48 34 48s21.79-.13 27.1-1.55c2.93-.78 4.64-3.26 5.42-6.19C67.94 34.95 68 24 68 24s-.06-10.95-1.48-16.26z" fill="#FF0000"/>
        <path d="M45 24 27 14v20" fill="#fff"/>
      </svg>
    </div>`;

  const grid = document.getElementById('grid');
  grid.innerHTML = tales.map(t => `
    <a class="card" href="https://www.youtube.com/watch?v=${t.id}" target="_blank" rel="noopener noreferrer" aria-label="${t.title} 뮤지컬 보기">
      <div class="thumb">
        <img
          src="https://i.ytimg.com/vi/${t.id}/maxresdefault.jpg"
          onerror="this.onerror=null;this.src='https://i.ytimg.com/vi/${t.id}/hqdefault.jpg';"
          alt="${t.title} 썸네일"
          loading="lazy">
        ${playIcon}
      </div>
      <div class="info">
        <div class="title">${t.title}</div>
        <div class="badge">뮤지컬 동화</div>
      </div>
    </a>
  `).join('');
</script>
</body>
</html>

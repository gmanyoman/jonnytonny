<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#fdf4e3">
<title>또리의 뮤지컬 동화</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1: #fff1d6;
    --bg-2: #ffd9e8;
    --bg-3: #e6dcff;
    --ink: #3a2540;
    --ink-soft: #6b5470;
    --card: #fffaf2;
    --gold: #e8a13a;
    --pink: #f06292;
    --lilac: #9c7ed1;
    --shadow: 0 8px 20px rgba(90, 50, 100, 0.12);
    --shadow-hover: 0 14px 32px rgba(90, 50, 100, 0.22);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }

  body {
    font-family: 'Gowun Dodum', sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 15% 10%, var(--bg-2) 0%, transparent 45%),
      radial-gradient(circle at 85% 90%, var(--bg-3) 0%, transparent 50%),
      var(--bg-1);
    background-attachment: fixed;
    min-height: 100vh;
    overflow-x: hidden;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  }

  body::before, body::after {
    content: '';
    position: fixed;
    pointer-events: none;
    z-index: 0;
    background-repeat: no-repeat;
    opacity: 0.6;
  }
  body::before {
    top: 10%; left: 5%;
    width: 60px; height: 60px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23e8a13a'><path d='M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8z'/></svg>");
    background-size: contain;
    animation: float 6s ease-in-out infinite;
  }
  body::after {
    bottom: 8%; right: 6%;
    width: 50px; height: 50px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23f06292'><path d='M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8z'/></svg>");
    background-size: contain;
    animation: float 7s ease-in-out infinite reverse;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-20px) rotate(15deg); }
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 32px 18px 150px;
    position: relative;
    z-index: 1;
  }

  header { text-align: center; margin-bottom: 22px; }
  .crown {
    font-size: 34px;
    display: inline-block;
    margin-bottom: 2px;
    animation: wiggle 3s ease-in-out infinite;
  }
  @keyframes wiggle {
    0%, 100% { transform: rotate(-5deg); }
    50% { transform: rotate(5deg); }
  }

  h1 {
    font-family: 'Black Han Sans', sans-serif;
    font-size: clamp(34px, 7vw, 56px);
    line-height: 1.1;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, var(--pink) 0%, var(--lilac) 50%, var(--gold) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    padding-bottom: 6px;
  }

  .subtitle {
    font-family: 'Jua', sans-serif;
    font-size: clamp(14px, 3.5vw, 17px);
    color: var(--ink-soft);
    margin-top: 6px;
    letter-spacing: 0.5px;
  }
  .subtitle::before, .subtitle::after {
    content: '✦';
    color: var(--gold);
    margin: 0 10px;
    opacity: 0.7;
  }

  /* Search row + compact play buttons */
  .search-row {
    display: flex;
    gap: 8px;
    max-width: 640px;
    margin: 22px auto 28px;
    align-items: stretch;
  }
  .search-wrap {
    flex: 1;
    min-width: 0;
    position: relative;
  }
  .search-wrap .ic {
    position: absolute;
    left: 18px;
    top: 50%;
    transform: translateY(-50%);
    width: 20px;
    height: 20px;
    color: var(--ink-soft);
    opacity: 0.7;
    pointer-events: none;
  }
  #search {
    width: 100%;
    height: 50px;
    padding: 0 44px 0 50px;
    border: 2px solid rgba(232, 161, 58, 0.25);
    border-radius: 999px;
    background: var(--card);
    color: var(--ink);
    font-family: 'Gowun Dodum', sans-serif;
    font-size: 16px;
    box-shadow: var(--shadow);
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
    -webkit-appearance: none;
    appearance: none;
  }
  #search::placeholder { color: var(--ink-soft); opacity: 0.55; }
  #search:focus {
    border-color: var(--pink);
    box-shadow: 0 0 0 4px rgba(240, 98, 146, 0.15), var(--shadow);
  }

  /* Clear button inside search (shown when there's input) */
  .clear-btn {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    width: 30px;
    height: 30px;
    border: none;
    border-radius: 50%;
    background: rgba(106, 84, 112, 0.1);
    color: var(--ink-soft);
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    transition: background 0.2s ease, transform 0.15s ease;
  }
  .clear-btn svg { width: 14px; height: 14px; }
  .clear-btn:hover { background: rgba(106, 84, 112, 0.2); }
  .clear-btn:active { transform: translateY(-50%) scale(0.9); }
  .search-wrap.has-value .clear-btn { display: flex; }

  .qp-btn {
    height: 50px;
    padding: 0 18px;
    border-radius: 999px;
    font-family: 'Jua', sans-serif;
    font-size: 15px;
    cursor: pointer;
    background: var(--card);
    color: var(--ink);
    border: 2px solid var(--gold);
    box-shadow: 0 4px 12px rgba(232, 161, 58, 0.18);
    transition: transform 0.15s ease, background 0.2s ease;
    flex-shrink: 0;
    letter-spacing: -0.3px;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    line-height: 1.15;
  }
  .qp-btn:hover { background: #fff4e0; }
  .qp-btn:active { transform: scale(0.94); }

  /* On narrow screens: keep one row, but button text wraps to 2 lines inside */
  @media (max-width: 480px) {
    .qp-btn {
      white-space: normal;
      word-break: keep-all;
      padding: 0 8px;
      font-size: 13px;
      width: 60px;
    }
  }

  /* Grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }
  @media (min-width: 640px) {
    .grid { grid-template-columns: repeat(3, 1fr); gap: 18px; }
  }
  @media (min-width: 960px) {
    .grid { grid-template-columns: repeat(4, 1fr); gap: 20px; }
  }

  .card {
    display: block;
    text-decoration: none;
    color: inherit;
    background: var(--card);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: var(--shadow);
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    position: relative;
    border: 2px solid rgba(232, 161, 58, 0.15);
    animation: rise 0.5s ease backwards;
    cursor: pointer;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .card:nth-child(1) { animation-delay: 0.04s; }
  .card:nth-child(2) { animation-delay: 0.08s; }
  .card:nth-child(3) { animation-delay: 0.12s; }
  .card:nth-child(4) { animation-delay: 0.16s; }
  .card:nth-child(5) { animation-delay: 0.20s; }
  .card:nth-child(6) { animation-delay: 0.24s; }
  .card:nth-child(7) { animation-delay: 0.28s; }
  .card:nth-child(8) { animation-delay: 0.32s; }
  .card:nth-child(9) { animation-delay: 0.36s; }

  .card:hover, .card:active {
    transform: translateY(-4px);
    box-shadow: var(--shadow-hover);
  }

  .card.playing {
    border-color: var(--pink);
    box-shadow: 0 0 0 3px rgba(240, 98, 146, 0.18), var(--shadow-hover);
  }
  .card.playing .now-playing { display: flex; }

  .card.fav {
    border-color: rgba(232, 161, 58, 0.5);
    background: linear-gradient(180deg, #fffcf2 0%, var(--card) 100%);
  }

  .thumb {
    position: relative;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    background: linear-gradient(135deg, var(--bg-2), var(--bg-3));
  }
  .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.4s ease;
  }
  .card:hover .thumb img { transform: scale(1.06); }

  .play {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .play svg {
    width: 46px; height: 46px;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.35));
    opacity: 0.95;
    transition: transform 0.25s ease;
  }
  .card:hover .play svg { transform: scale(1.15); }
  @media (min-width: 640px) {
    .play svg { width: 54px; height: 54px; }
  }

  .now-playing {
    display: none;
    position: absolute;
    top: 8px;
    left: 8px;
    background: var(--pink);
    color: white;
    font-family: 'Jua', sans-serif;
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 999px;
    align-items: center;
    gap: 5px;
    box-shadow: 0 2px 8px rgba(240,98,146,0.4);
    z-index: 2;
  }
  .now-playing .bars {
    display: inline-flex;
    align-items: flex-end;
    gap: 2px;
    height: 10px;
  }
  .now-playing .bars span {
    display: inline-block;
    width: 2px;
    background: white;
    border-radius: 1px;
    animation: bar 0.9s ease-in-out infinite;
  }
  .now-playing .bars span:nth-child(1) { height: 60%; animation-delay: -0.4s; }
  .now-playing .bars span:nth-child(2) { height: 100%; animation-delay: -0.2s; }
  .now-playing .bars span:nth-child(3) { height: 70%; animation-delay: -0.6s; }
  @keyframes bar {
    0%, 100% { transform: scaleY(0.4); }
    50% { transform: scaleY(1); }
  }

  /* Star favorite button - bottom-right of thumb */
  .fav-btn {
    position: absolute;
    bottom: 6px;
    right: 6px;
    width: 36px;
    height: 36px;
    border: none;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.32);
    backdrop-filter: blur(4px);
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 3;
    transition: background 0.2s ease, transform 0.15s ease;
  }
  .fav-btn:hover { background: rgba(0, 0, 0, 0.5); }
  .fav-btn:active { transform: scale(0.85); }
  .fav-btn svg {
    width: 20px;
    height: 20px;
    transition: transform 0.25s cubic-bezier(.34,1.56,.64,1);
  }
  .card.fav .fav-btn {
    background: var(--gold);
    color: white;
    box-shadow: 0 3px 10px rgba(232, 161, 58, 0.5);
  }
  .card.fav .fav-btn svg { transform: scale(1.1); }

  .info {
    padding: 14px 10px 18px;
    text-align: center;
  }
  .title {
    font-family: 'Jua', sans-serif;
    font-size: clamp(19px, 5vw, 24px);
    color: var(--ink);
    letter-spacing: -0.3px;
    line-height: 1.25;
  }

  .empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--ink-soft);
    font-family: 'Jua', sans-serif;
    font-size: 17px;
    display: none;
  }
  .empty.show { display: block; }
  .empty .face { font-size: 38px; display: block; margin-bottom: 10px; }

  footer {
    text-align: center;
    margin-top: 40px;
    font-size: 13px;
    color: var(--ink-soft);
    font-family: 'Gowun Dodum', sans-serif;
    opacity: 0.7;
  }
  footer .heart { color: var(--pink); }

  /* Hidden YouTube player */
  #yt-host {
    position: fixed;
    bottom: -100px;
    right: -100px;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: -1;
  }

  /* Mini player */
  .miniplayer {
    position: fixed;
    left: 12px;
    right: 12px;
    bottom: 12px;
    max-width: 720px;
    margin: 0 auto;
    background: var(--card);
    border: 2px solid rgba(232, 161, 58, 0.25);
    border-radius: 18px;
    box-shadow: 0 -2px 20px rgba(90, 50, 100, 0.18), 0 12px 30px rgba(90, 50, 100, 0.18);
    padding: 10px 12px 10px 12px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 100;
    transform: translateY(140%);
    transition: transform 0.35s cubic-bezier(.2,.9,.3,1.1);
    overflow: hidden;
  }
  .miniplayer.show { transform: translateY(0); }

  /* Progress bar at top of mini player */
  .mp-progress {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: rgba(232, 161, 58, 0.15);
  }
  .mp-progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--pink), var(--lilac), var(--gold));
    transition: width 0.5s linear;
  }

  .mp-thumb {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--bg-2), var(--bg-3));
    overflow: hidden;
    flex-shrink: 0;
  }
  .mp-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .miniplayer.playing .mp-thumb img {
    animation: spin 8s linear infinite;
  }
  @keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }

  .mp-info {
    flex: 1;
    min-width: 0;
  }
  .mp-label {
    font-family: 'Gowun Dodum', sans-serif;
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.3px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .mp-label .shuffle-tag {
    display: none;
    background: var(--gold);
    color: white;
    font-family: 'Jua', sans-serif;
    padding: 1px 6px;
    border-radius: 6px;
    font-size: 10px;
  }
  .miniplayer.shuffle .mp-label .shuffle-tag { display: inline-block; }
  .mp-label .dot { opacity: 0.4; }
  .mp-time { font-variant-numeric: tabular-nums; }
  .mp-title {
    font-family: 'Jua', sans-serif;
    font-size: 17px;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.2;
    margin-top: 1px;
  }

  .mp-actions {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }
  .mp-btn {
    width: 42px;
    height: 42px;
    border: none;
    background: transparent;
    color: var(--ink);
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s ease, transform 0.15s ease;
  }
  .mp-btn:hover { background: rgba(232, 161, 58, 0.13); }
  .mp-btn:active { transform: scale(0.92); }
  .mp-btn svg { width: 22px; height: 22px; }
  .mp-btn.primary {
    background: linear-gradient(135deg, var(--pink), var(--lilac));
    color: white;
    box-shadow: 0 4px 12px rgba(240, 98, 146, 0.4);
  }
  .mp-btn.primary:hover { background: linear-gradient(135deg, var(--pink), var(--lilac)); filter: brightness(1.08); }
  .mp-btn.primary svg { width: 18px; height: 18px; }

  @media (max-width: 380px) {
    .mp-btn { width: 38px; height: 38px; }
    .mp-thumb { width: 42px; height: 42px; }
    .mp-title { font-size: 15px; }
  }
</style>
</head>
<body>
  <div class="container">
    <header>
      <div class="crown">👑</div>
      <h1>또리의 뮤지컬 동화</h1>
      <p class="subtitle">또미제리가 함께 만드는 동화 이야기</p>
    </header>

    <div class="search-row">
      <div class="search-wrap" id="search-wrap">
        <svg class="ic" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input id="search" type="text" placeholder="제목으로 찾기" autocomplete="off" spellcheck="false" enterkeyhint="search">
        <button class="clear-btn" id="search-clear" type="button" aria-label="검색어 지우기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 6l12 12M18 6L6 18"/>
          </svg>
        </button>
      </div>
      <button class="qp-btn" id="btn-play-all">전체 재생</button>
      <button class="qp-btn" id="btn-shuffle">랜덤 재생</button>
    </div>

    <main class="grid" id="grid"></main>
    <div class="empty" id="empty">
      <span class="face">🔍</span>
      찾으시는 동화가 없어요
    </div>

    <footer>
      Made with <span class="heart">♥</span> for our little stars
    </footer>
  </div>

  <!-- Hidden YouTube player -->
  <div id="yt-host"><div id="ytplayer"></div></div>

  <!-- Mini Player UI -->
  <div class="miniplayer" id="miniplayer" aria-live="polite">
    <div class="mp-progress"><div class="mp-progress-bar" id="mp-progress-bar"></div></div>
    <div class="mp-thumb">
      <img id="mp-thumb-img" alt="" src="">
    </div>
    <div class="mp-info">
      <div class="mp-label">
        <span>재생 중</span>
        <span class="shuffle-tag">랜덤</span>
        <span class="dot">·</span>
        <span class="mp-time" id="mp-time">0:00 / 0:00</span>
      </div>
      <div class="mp-title" id="mp-title">—</div>
    </div>
    <div class="mp-actions">
      <button class="mp-btn primary" id="mp-toggle" aria-label="재생/일시정지">
        <svg id="mp-toggle-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="mp-btn" id="mp-yt" aria-label="유튜브에서 열기" title="유튜브에서 열기">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.58 7.19a2.51 2.51 0 0 0-1.77-1.77C18.25 5 12 5 12 5s-6.25 0-7.81.42A2.51 2.51 0 0 0 2.42 7.19 26.07 26.07 0 0 0 2 12a26.07 26.07 0 0 0 .42 4.81 2.51 2.51 0 0 0 1.77 1.77C5.75 19 12 19 12 19s6.25 0 7.81-.42a2.51 2.51 0 0 0 1.77-1.77A26.07 26.07 0 0 0 22 12a26.07 26.07 0 0 0-.42-4.81zM10 15V9l5.2 3z"/></svg>
      </button>
      <button class="mp-btn" id="mp-close" aria-label="닫기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </div>

<script>
  const tales = [
    { title: '인어공주',        id: 'h3xiBmUmkcQ' },
    { title: '백설공주',        id: 'PPmN-kZioNA' },
    { title: '잠자는 숲 속의 공주', id: 'wK9g_KSzQmk' },
    { title: '라푼젤',          id: '047kwHXx2bc' },
    { title: '엄지공주',        id: 'M08wE7PebqE' },
    { title: '신데렐라',        id: 'Dmk8d4D4fes' },
    { title: '아기돼지 삼형제',  id: '1Ns6TTTrIXk' },
    { title: '개구리 왕자',     id: 'r2KgFrCsN7E' },
    { title: '미녀와 야수',     id: 'GB-hp7skvHU' },
  ];

  /* ---------- localStorage helpers ---------- */
  const KEY_FAV = 'tory:favorites';
  const KEY_COUNT = 'tory:playCounts';

  function getFavorites() {
    try { return JSON.parse(localStorage.getItem(KEY_FAV) || '[]'); }
    catch { return []; }
  }
  function setFavorites(arr) {
    try { localStorage.setItem(KEY_FAV, JSON.stringify(arr)); } catch {}
  }
  function getPlayCounts() {
    try { return JSON.parse(localStorage.getItem(KEY_COUNT) || '{}'); }
    catch { return {}; }
  }
  function setPlayCounts(obj) {
    try { localStorage.setItem(KEY_COUNT, JSON.stringify(obj)); } catch {}
  }
  function isFav(id) { return getFavorites().includes(id); }
  function toggleFav(id) {
    const favs = getFavorites();
    const idx = favs.indexOf(id);
    if (idx >= 0) favs.splice(idx, 1);
    else favs.push(id);
    setFavorites(favs);
    return idx < 0; // returns new state
  }
  function bumpCount(id) {
    const counts = getPlayCounts();
    counts[id] = (counts[id] || 0) + 1;
    setPlayCounts(counts);
    return counts[id];
  }

  /* ---------- Card markup ---------- */
  const playIconBig = `
    <div class="play">
      <svg viewBox="0 0 68 48" xmlns="http://www.w3.org/2000/svg">
        <path d="M66.52 7.74c-.78-2.93-2.49-5.41-5.42-6.19C55.79.13 34 0 34 0S12.21.13 6.9 1.55C3.97 2.33 2.27 4.81 1.48 7.74 .06 13.05 0 24 0 24s.06 10.95 1.48 16.26c.78 2.93 2.49 5.41 5.42 6.19C12.21 47.87 34 48 34 48s21.79-.13 27.1-1.55c2.93-.78 4.64-3.26 5.42-6.19C67.94 34.95 68 24 68 24s-.06-10.95-1.48-16.26z" fill="#FF0000"/>
        <path d="M45 24 27 14v20" fill="#fff"/>
      </svg>
    </div>`;

  const nowPlayingBadge = `
    <div class="now-playing">
      <span class="bars"><span></span><span></span><span></span></span>
      재생 중
    </div>`;

  const starIcon = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>`;

  const grid = document.getElementById('grid');
  grid.innerHTML = tales.map((t, idx) => `
    <a class="card" data-title="${t.title}" data-id="${t.id}" data-idx="${idx}" data-count="0"
       href="https://www.youtube.com/watch?v=${t.id}" target="_blank" rel="noopener noreferrer"
       aria-label="${t.title} 재생">
      <div class="thumb">
        <img
          src="https://i.ytimg.com/vi/${t.id}/maxresdefault.jpg"
          onerror="this.onerror=null;this.src='https://i.ytimg.com/vi/${t.id}/hqdefault.jpg';"
          alt="${t.title} 썸네일"
          loading="lazy">
        ${playIconBig}
        ${nowPlayingBadge}
        <button class="fav-btn" type="button" aria-label="즐겨찾기" data-fav-for="${t.id}">
          ${starIcon}
        </button>
      </div>
      <div class="info">
        <div class="title">${t.title}</div>
      </div>
    </a>
  `).join('');

  /* ---------- Sort & display state ---------- */
  function applySortAndCounts() {
    const favs = getFavorites();
    const counts = getPlayCounts();
    document.querySelectorAll('.card').forEach(card => {
      const id = card.dataset.id;
      const idx = parseInt(card.dataset.idx, 10) || 0;
      const c = counts[id] || 0;
      const fav = favs.includes(id);
      // Lower order = earlier. Favs get huge boost; high count next; idx is tiebreaker
      card.style.order = (fav ? -100000 : 0) - c * 100 + idx;
      card.classList.toggle('fav', fav);
      card.dataset.count = c;
    });
  }

  /* ---------- Live search filter ---------- */
  const searchInput = document.getElementById('search');
  const emptyState = document.getElementById('empty');
  const cards = document.querySelectorAll('.card');
  const searchWrap = document.getElementById('search-wrap');
  const searchClear = document.getElementById('search-clear');

  function applySearchFilter() {
    const q = searchInput.value.toLowerCase().replace(/\s+/g, '').trim();
    let visible = 0;
    cards.forEach(card => {
      const t = card.dataset.title.toLowerCase().replace(/\s+/g, '');
      const match = q === '' || t.includes(q);
      card.style.display = match ? '' : 'none';
      if (match) visible++;
    });
    emptyState.classList.toggle('show', visible === 0);
    searchWrap.classList.toggle('has-value', searchInput.value.length > 0);
  }

  searchInput.addEventListener('input', applySearchFilter);
  searchClear.addEventListener('click', () => {
    searchInput.value = '';
    applySearchFilter();
    searchInput.focus();
  });

  /* ---------- Favorite button handlers ---------- */
  document.querySelectorAll('.fav-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      const id = btn.dataset.favFor;
      toggleFav(id);
      applySortAndCounts();
    });
  });

  /* ---------- YouTube Audio Player ---------- */
  (function () {
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);
  })();

  let player = null;
  let playerReady = false;
  let pendingVideo = null;
  let currentId = null;
  let isPlaying = false;
  let countedForCurrentLoad = false;

  // Queue
  let queue = [];
  let queueIndex = -1;
  let isShuffleMode = false;

  // Progress
  let progressTimer = null;

  // Wake lock
  let wakeLock = null;

  const mp = document.getElementById('miniplayer');
  const mpTitle = document.getElementById('mp-title');
  const mpThumb = document.getElementById('mp-thumb-img');
  const mpToggle = document.getElementById('mp-toggle');
  const mpToggleIcon = document.getElementById('mp-toggle-icon');
  const mpYt = document.getElementById('mp-yt');
  const mpClose = document.getElementById('mp-close');
  const mpProgressBar = document.getElementById('mp-progress-bar');
  const mpTime = document.getElementById('mp-time');

  const playIconSvg  = '<path d="M8 5v14l11-7z"/>';
  const pauseIconSvg = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';

  function shuffled(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function formatTime(sec) {
    if (!isFinite(sec) || sec < 0) sec = 0;
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return m + ':' + String(s).padStart(2, '0');
  }

  function startProgress() {
    stopProgress();
    progressTimer = setInterval(() => {
      if (!player || typeof player.getCurrentTime !== 'function') return;
      try {
        const cur = player.getCurrentTime();
        const dur = player.getDuration();
        if (dur > 0) {
          mpProgressBar.style.width = ((cur / dur) * 100) + '%';
          mpTime.textContent = formatTime(cur) + ' / ' + formatTime(dur);
        }
      } catch (e) {}
    }, 500);
  }
  function stopProgress() {
    if (progressTimer) { clearInterval(progressTimer); progressTimer = null; }
  }

  /* ---- Wake Lock ---- */
  async function requestWakeLock() {
    if (!('wakeLock' in navigator)) return;
    try {
      if (wakeLock) return;
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } catch (e) { /* silently ignore */ }
  }
  function releaseWakeLock() {
    if (wakeLock) {
      try { wakeLock.release(); } catch (e) {}
      wakeLock = null;
    }
  }
  // Re-acquire on tab visible if still playing
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && isPlaying) {
      requestWakeLock();
    }
  });

  window.onYouTubeIframeAPIReady = function () {
    player = new YT.Player('ytplayer', {
      height: '180',
      width: '320',
      playerVars: { playsinline: 1, rel: 0, modestbranding: 1 },
      events: {
        onReady: () => {
          playerReady = true;
          if (pendingVideo) {
            const p = pendingVideo; pendingVideo = null;
            playVideo(p.id, p.title);
          }
        },
        onStateChange: (e) => {
          if (e.data === YT.PlayerState.PLAYING) {
            isPlaying = true;
            // Count this play (once per load)
            if (!countedForCurrentLoad && currentId) {
              bumpCount(currentId);
              countedForCurrentLoad = true;
              applySortAndCounts();
            }
            startProgress();
            requestWakeLock();
            updateUI();
          } else if (e.data === YT.PlayerState.PAUSED) {
            isPlaying = false;
            stopProgress();
            releaseWakeLock();
            updateUI();
          } else if (e.data === YT.PlayerState.ENDED) {
            isPlaying = false;
            stopProgress();
            releaseWakeLock();
            updateUI();
            advanceQueue();
          }
        },
        onError: () => {
          alert('이 영상은 페이지에서 재생할 수 없어요. 유튜브에서 열어드릴게요!');
          if (currentId) window.open('https://www.youtube.com/watch?v=' + currentId, '_blank');
          advanceQueue();
        }
      }
    });
  };

  function playVideo(id, title) {
    countedForCurrentLoad = false;
    if (!playerReady || !player || typeof player.loadVideoById !== 'function') {
      pendingVideo = { id, title };
      currentId = id;
      mpTitle.textContent = title;
      mpThumb.src = 'https://i.ytimg.com/vi/' + id + '/mqdefault.jpg';
      mpThumb.alt = title + ' 썸네일';
      mpProgressBar.style.width = '0%';
      mpTime.textContent = '0:00 / 0:00';
      mp.classList.add('show');
      return;
    }
    currentId = id;
    mpTitle.textContent = title;
    mpThumb.src = 'https://i.ytimg.com/vi/' + id + '/mqdefault.jpg';
    mpThumb.alt = title + ' 썸네일';
    mpProgressBar.style.width = '0%';
    mpTime.textContent = '0:00 / 0:00';
    mp.classList.add('show');
    mp.classList.toggle('shuffle', isShuffleMode);
    player.loadVideoById(id);
  }

  function playCurrent() {
    if (queueIndex >= 0 && queueIndex < queue.length) {
      const t = queue[queueIndex];
      playVideo(t.id, t.title);
    }
  }
  function advanceQueue() {
    if (queueIndex >= 0 && queueIndex < queue.length - 1) {
      queueIndex++;
      playCurrent();
    } else {
      closePlayer();
    }
  }
  function playAll() {
    isShuffleMode = false;
    queue = tales.slice();
    queueIndex = 0;
    playCurrent();
  }
  function playShuffle() {
    isShuffleMode = true;
    queue = shuffled(tales);
    queueIndex = 0;
    playCurrent();
  }
  function playFromCard(id) {
    isShuffleMode = false;
    queue = tales.slice();
    queueIndex = tales.findIndex(t => t.id === id);
    if (queueIndex < 0) queueIndex = 0;
    playCurrent();
  }

  function updateUI() {
    mpToggleIcon.innerHTML = isPlaying ? pauseIconSvg : playIconSvg;
    mp.classList.toggle('playing', isPlaying);
    document.querySelectorAll('.card').forEach(c => {
      c.classList.toggle('playing', c.dataset.id === currentId && isPlaying);
    });
  }

  function closePlayer() {
    if (player && typeof player.stopVideo === 'function') {
      try { player.stopVideo(); } catch(e) {}
    }
    isPlaying = false;
    currentId = null;
    queue = [];
    queueIndex = -1;
    isShuffleMode = false;
    stopProgress();
    releaseWakeLock();
    mpProgressBar.style.width = '0%';
    mpTime.textContent = '0:00 / 0:00';
    mp.classList.remove('show', 'playing', 'shuffle');
    updateUI();
  }

  /* ---------- Wire it all up ---------- */
  document.getElementById('btn-play-all').addEventListener('click', playAll);
  document.getElementById('btn-shuffle').addEventListener('click', playShuffle);

  cards.forEach(card => {
    card.addEventListener('click', (e) => {
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1) return;
      // Ignore clicks on the favorite button (handled separately)
      if (e.target.closest('.fav-btn')) return;
      e.preventDefault();
      playFromCard(card.dataset.id);
    });
  });

  mpToggle.addEventListener('click', () => {
    if (!player) return;
    if (isPlaying) player.pauseVideo();
    else player.playVideo();
  });
  mpYt.addEventListener('click', () => {
    if (currentId) window.open('https://www.youtube.com/watch?v=' + currentId, '_blank');
  });
  mpClose.addEventListener('click', closePlayer);

  // Initial sort/render based on saved data
  applySortAndCounts();
</script>
</body>
</html>
